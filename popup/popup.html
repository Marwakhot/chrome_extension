<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Focus Mode Tab Killer</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    width: 280px;
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #111318;
    color: #f0f0f2;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 4px;
  }
  p.subtitle {
    font-size: 11px;
    color: #9a9ba3;
    margin: 0 0 16px;
  }
  .setup, .locked, .expired {
    display: none;
  }
  .setup.visible, .locked.visible, .expired.visible {
    display: block;
  }
  label {
    display: block;
    font-size: 12px;
    color: #c4c5cc;
    margin-bottom: 6px;
  }
  select, input[type="number"] {
    width: 100%;
    padding: 8px;
    font-size: 13px;
    border-radius: 6px;
    border: 1px solid #33353f;
    background: #1b1d24;
    color: #f0f0f2;
    margin-bottom: 12px;
    box-sizing: border-box;
  }
  input[type="number"] {
    display: none;
  }
  input[type="number"].visible {
    display: block;
  }
  button {
    width: 100%;
    padding: 10px;
    font-size: 13px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .start-btn {
    background: #4f8cff;
    color: white;
  }
  .start-btn:hover {
    background: #3b7ae6;
  }
  .countdown {
    text-align: center;
    font-size: 34px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin: 12px 0 6px;
    color: #ff6b6b;
  }
  .locked-note {
    text-align: center;
    font-size: 11px;
    color: #9a9ba3;
    margin-bottom: 14px;
  }
  .stop-btn {
    background: #2a2d36;
    color: #6a6c76;
    cursor: not-allowed;
  }
  .status-line {
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: center;
    font-size: 11px;
    color: #9a9ba3;
    margin-bottom: 12px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff4d4d;
    box-shadow: 0 0 6px #ff4d4d;
  }
  .expired p {
    font-size: 13px;
    text-align: center;
    margin: 6px 0 16px;
  }
</style>
</head>
<body>
  <h1>Focus Mode Tab Killer</h1>
  <p class="subtitle">Strict Timer Edition &mdash; 100% local classification</p>

  <div class="setup" id="setupView">
    <label for="duration">Session duration</label>
    <select id="duration">
      <option value="15">15 minutes</option>
      <option value="25" selected>25 minutes</option>
      <option value="45">45 minutes</option>
      <option value="60">60 minutes</option>
      <option value="custom">Custom&hellip;</option>
    </select>
    <input type="number" id="customDuration" min="1" max="1440" step="1" placeholder="Minutes (1-1440)" />
    <button class="start-btn" id="startBtn">Start Focus Session</button>
  </div>

  <div class="locked" id="lockedView">
    <div class="status-line"><span class="dot"></span>FOCUS MODE ACTIVE</div>
    <div class="countdown" id="countdown">00:00</div>
    <p class="locked-note">Session is locked. It cannot be stopped early.</p>
    <button class="stop-btn" id="stopBtn" disabled>Locked Until Timer Ends</button>
  </div>

  <div class="expired" id="expiredView">
    <p>Focus session complete. 🎉</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
